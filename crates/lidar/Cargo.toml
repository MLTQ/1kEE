[package]
name = "lidar-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
builder = ["dep:gdal-sys", "dep:las", "dep:fs2", "dep:sha2"]
ept = ["dep:las", "dep:sha2", "dep:reqwest", "dep:fs2"]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.11"
png = "0.18"
tempfile = "3"
gdal-sys = { version = "0.12", features = ["bindgen"], optional = true }
las = { version = "0.11.2", features = ["laz-parallel"], optional = true }
fs2 = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[[bin]]
name = "one-thousand-electric-eye-lidar"
path = "src/main.rs"
required-features = ["builder"]
