[package]
name = "one-thousand-electric-eye-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1"
sha1 = "0.10"
lz4_flex = { version = "0.11.6", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
bytemuck = { version = "1", features = ["derive"] }
egui = "0.31"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
osmpbf = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
cell-format = { path = "../cell_format" }
tile-archive = { path = "../tile_archive" }
gruve-sdk = { path = "../gruve_sdk" }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
crossbeam-channel = "0.5.15"
csv = "1.4"
protobuf = "2.28"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1"
rayon = "1.11.0"
lyon_tessellation = "1"
one-thousand-electric-eye-cache-builder = { path = "../cache_builder" }
scraper = { version = "0.24", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem"] }

[build-dependencies]
protobuf-codegen-pure = "2.28"
