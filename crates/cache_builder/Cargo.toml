[package]
name = "one-thousand-electric-eye-cache-builder"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
same-file = "1"
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.31"
flate2 = { version = "1", features = ["zlib-rs"] }
tiff = "0.11"
libdeflater = "1"
hashlink = "0.9"
osmpbf = "0.2"
rayon = "1"
smallvec = "1"
rfd = "0.15"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cell-format = { path = "../cell_format" }
tile-archive = { path = "../tile_archive" }
ring = "0.17"
tempfile = "3"

bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
